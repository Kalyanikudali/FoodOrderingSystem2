
spring.application.name=foodOrderingSystem

# Database configuration (uses environment variables in cloud, falls back to local)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/food?useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:1236790}

# Server port (PaaS providers like Render pass PORT dynamically)
server.port=${PORT:9292}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true